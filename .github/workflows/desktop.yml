name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 desktop-file-utils
      - run: python -m pip install ".[build,test]"
      - name: Test decoding and viewer interactions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm packaging/HiFine.spec
      - name: Verify packaged HEIF decoder
        shell: python
        run: |
          from pathlib import Path
          import sys, subprocess
          from PIL import Image
          exe = Path("dist/HiFine/HiFine.exe" if sys.platform == "win32" else
                     "dist/HiFine.app/Contents/MacOS/HiFine" if sys.platform == "darwin" else
                     "dist/HiFine/HiFine").resolve()
          sample = next(Path("src/hifine/assets/samples").glob("*.hif"))
          output = Path("build/thumbnail-test.png")
          subprocess.run([exe, "--thumbnail", sample, output, "192"], check=True)
          with Image.open(output) as thumbnail:
              assert thumbnail.format == "PNG" and thumbnail.size == (192, 123)
      - name: Open a photo with the packaged Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem src/hifine/assets/samples/*.hif).FullName build/gui-smoke.hif
          $viewer = Start-Process dist/HiFine/HiFine.exe -ArgumentList build/gui-smoke.hif -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 200
              $viewer.Refresh()
              if ($viewer.HasExited) { throw "HiFine exited before showing the photo" }
              if ($viewer.MainWindowTitle -like "gui-smoke.hif*HiFine") { break }
            } while ((Get-Date) -lt $deadline)
            if ($viewer.MainWindowTitle -notlike "gui-smoke.hif*HiFine") { throw "Photo window did not open" }
          } finally {
            if (!$viewer.HasExited) {
              $null = $viewer.CloseMainWindow()
              if (!$viewer.WaitForExit(5000)) { $viewer.Kill() }
            }
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python packaging/windows/build_installer.py
      - name: Verify Windows association, thumbnail provider and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/windows/installer_smoke.py "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/*.desktop
          sh packaging/linux/build-deb.sh
      - name: Build macOS disk image and verify bundled extension
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/build-dmg.sh
          plutil -lint dist/HiFine.app/Contents/Info.plist
          plutil -lint dist/HiFine.app/Contents/PlugIns/HiFineThumbnail.appex/Contents/Info.plist
          hdiutil verify release/*.dmg
      - name: Request a HIF thumbnail through Quick Look
        if: runner.os == 'macOS'
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          from PIL import Image
          bundle = Path("dist/HiFine.app").resolve()
          register = "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
          subprocess.run([register, "-f", bundle], check=True)
          folder = Path("build/quicklook")
          folder.mkdir()
          sample = next(Path("src/hifine/assets/samples").glob("*.hif"))
          subprocess.run(["qlmanage", "-t", "-s", "256", "-o", folder, sample], timeout=60, check=True)
          with Image.open(next(folder.glob("*.png"))) as thumbnail:
              assert max(thumbnail.size) >= 128
      - name: Open a registered HIF document through macOS Launch Services
        if: runner.os == 'macOS'
        run: swift tests/macos/open_photo.swift "$PWD/dist/HiFine.app" "$PWD"/src/hifine/assets/samples/*.hif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HiFine-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish verified installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: HiFine-*
          path: installers
          merge-multiple: true
      - name: Include the HEIF codec sources
        run: |
          python3 packaging/build_heif_sources.py
          python3 packaging/build_heif_sources.py --verify release/*-heif-sources.zip
          mv release/*-heif-sources.zip installers/
      - name: Verify version and generate checksums
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["TAG"] == f"v{version}", "The tag must match the package version"
          root = Path("installers")
          expected = {f"HiFine-{version}-{suffix}" for suffix in (
              "windows-x64-setup.exe", "linux-amd64.deb", "macOS-arm64.dmg", "macOS-x86_64.dmg",
              "heif-sources.zip",
          )}
          assert {p.name for p in root.iterdir()} == expected, "Incomplete or unexpected release assets"
          sums = []
          for name in sorted(expected):
              with (root / name).open("rb") as stream:
                  sums.append(f"{hashlib.file_digest(stream, 'sha256').hexdigest()}  {name}\n")
          (root / "SHA256SUMS.txt").write_text("".join(sums), encoding="ascii")
      - name: Publish the release after verifying the uploaded assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_notes="docs/releases/$TAG.md"
          test -s "$source_notes"
          notes="$RUNNER_TEMP/release-notes.md"
          footer='[已有 Mirror酱 CDK？前往 Mirror酱 高速下载](https://mirrorchyan.com/zh/projects?rid=HiFine&source=hifine_release)'
          body=$(awk -v footer="$footer" '$0 != footer' "$source_notes")
          printf '%s\n\n%s\n' "$body" "$footer" > "$notes"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            jq -e '.isDraft' "$RUNNER_TEMP/release-state.json" >/dev/null
          else
            gh release create "$TAG" --draft --verify-tag --title "HiFine $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" installers/* --clobber
          (cd installers && sha256sum -- *) | sort -k2 > "$RUNNER_TEMP/expected"
          gh release view "$TAG" --json assets --jq '.assets[] | [(.digest | sub("^sha256:"; "")), .name] | join("  ")' | sort -k2 > "$RUNNER_TEMP/uploaded"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/uploaded"
          gh release edit "$TAG" --draft=false --latest --notes-file "$notes"
      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ github.ref_name }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
